[package]
name = "control-plane-dcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "DCP (Decentralized Claims Protocol) verifier side for ds-control-plane-rs: checks a counterparty's Self-Issued ID Token, queries its Credential Service and verifies the presentation and credentials it returns, and holds the control plane's own did:web identity."

[dependencies]
ds-dcp-core-rs = { workspace = true }
p256 = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
