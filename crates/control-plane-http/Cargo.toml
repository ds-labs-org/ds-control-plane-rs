[package]
name = "control-plane-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ds-control-plane-rs"
path = "src/main.rs"

[dependencies]
control-plane-core = { path = "../control-plane-core" }
control-plane-graph = { path = "../control-plane-graph" }
control-plane-dcp = { path = "../control-plane-dcp" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
# Sends the Provider's own negotiation messages to the Consumer's
# callbackAddress (src/callback.rs).
reqwest = { workspace = true }

[dev-dependencies]
# tests/dcp_auth.rs plays the Consumer, its Credential Service and the
# issuers with the same DCP primitives the verifier uses.
ds-dcp-core-rs = { workspace = true }
tempfile = "3"
# tests/connector.rs drives the Contreforts connector over the running
# app's own graph.
contreforts-core = { path = "../../vendor/contreforts-core" }
control-plane-contreforts = { path = "../control-plane-contreforts" }
# tests/persistence.rs damages a stored record directly, below the graph
# crate's write checks, to check that startup and listings survive it.
oxigraph = { workspace = true }
tower = { version = "0.5", features = ["util"] }
# Runs the real `eclipsedataspacetck/dsp-tck-runtime` container in
# tests/dsp_tck.rs, same crate this project's sibling ds-sql-dps-rs uses for
# the analogous DPS TCK test.
testcontainers = "0.26"
# `LogConsumer::accept` returns a `BoxFuture`; the TCK container's own
# process exit code is always 0 regardless of test outcome, so its stdout
# has to be watched for failure lines instead (see tests/dsp_tck.rs).
futures = "0.3"
regex = "1"
