# Config for the official Eclipse Dataspace TCK's `dsp-tck-runtime`
# container, bind-mounted into it at /etc/tck/config.properties by
# tests/dsp_tck.rs. See that file's module doc comment for what the
# resulting test run does and does not assert, and ../../../ARCHITECTURE.md's
# "TCK conformance snapshot" section for the full picture.
#
# ---- Scope, and why it's drawn here ----
#
# This control plane is a bootstrap, Provider role only (see
# ../../../ARCHITECTURE.md, "Scope"). The DSP TCK's own config-driven
# filtering (`dataspacetck.test.package`, a JUnit PackageSelector — whole
# packages only, no per-class/per-method selector) operates at the level of
# a whole protocol's verification package
# (`org.eclipse.dataspacetck.dsp.verification.{metadata,catalog,cn,tp}`),
# which does not distinguish a package's Provider-role test classes
# (`CN`/`TP`) from its Consumer-role ones (`CN_C`/`TP_C`) — both live in the
# same package. So `dataspacetck.test.package` here names all four
# verification packages (this bootstrap's whole intended surface), and
# tests/dsp_tck.rs asserts the exact, already-known set of `CN_C`/`TP_C`
# failures this implies, the same pattern this project's sibling
# `ds-sql-dps-rs` uses for its own (differently scoped) TCK narrowing.
dataspacetck.test.package=org.eclipse.dataspacetck.dsp.verification

dataspacetck.debug=true
dataspacetck.local.connector=false
dataspacetck.host=0.0.0.0
dataspacetck.port=8083
dataspacetck.callback.address=http://localhost:8083
dataspacetck.dsp.connector.agent.id=urn:connector:ds-control-plane-rs

# Must match SERVER_PORT in tests/dsp_tck.rs: this file is a static
# bind-mount, so it can't learn an OS-assigned ephemeral port the way a
# plain HTTP integration test could.
dataspacetck.dsp.connector.http.url=http://host.docker.internal:28080/dsp/2025-1
dataspacetck.dsp.connector.http.base.url=http://host.docker.internal:28080

# Consumer-role initiation endpoints: this bootstrap implements no
# consumer-role HTTP surface at all (see ../../../ARCHITECTURE.md), so
# these deliberately point at paths this server does not serve — every
# CN_C/TP_C test that depends on the CUT acting as consumer fails exactly
# as documented in tests/dsp_tck.rs, rather than by an accidental
# malformed-request error against some other endpoint.
dataspacetck.dsp.connector.negotiation.initiate.url=http://host.docker.internal:28080/consumer/negotiate
dataspacetck.dsp.connector.transfer.initiate.url=http://host.docker.internal:28080/consumer/transfer

# NOTE: this property is seconds, not milliseconds, despite the TCK
# README's own example ("5000 (5 seconds)") suggesting otherwise — verified
# against the TCK's own source
# (dsp/dsp-system/.../DspSystemLauncher.java: `DEFAULT_WAIT_SECONDS = 15`,
# `configuration.getPropertyAsLong(DEFAULT_WAIT_CONFIG, DEFAULT_WAIT_SECONDS)`,
# and `AbstractAsyncPipeline.thenWait`'s `latch.await(waitTime, SECONDS)`).
# Kept short deliberately: several TP/CN provider tests wait for this
# control plane to *spontaneously* push a message (e.g. a
# TransferStartMessage) that this bootstrap never sends on its own (see
# ../../../ARCHITECTURE.md, "Stubbed" — negotiation/transfer progression);
# with the TCK's own default of 15s (or the README's suggested 5000s
# misreading), each such test would take that long to time out rather than
# failing promptly.
dataspacetck.dsp.default.wait=5

# Seeds the catalog tests with this bootstrap's one real, always-present
# dataset id (see crates/control-plane-http/src/state.rs, SEED_DATASET_ID)
# rather than the TCK's own random per-run UUID default, so CAT:01-01/01-02
# exercise this server's real seed dataset instead of failing on a dataset
# id it could never have known about. CAT:01-03 ("dataset request not
# found") deliberately has no override here — it needs the TCK's own random
# UUID default so the id is genuinely absent from this server's catalog.
CAT_01_01_DATASETID=urn:uuid:control-plane-rs-seed-dataset
CAT_01_02_DATASETID=urn:uuid:control-plane-rs-seed-dataset
